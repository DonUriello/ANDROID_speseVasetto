name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_SIGNING: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Prepara la chiave di firma
        if: env.HAS_SIGNING == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          # Spazi e a capo incollati per sbaglio nel secret non contano
          if ! printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/release.jks"; then
            echo "::error::SIGNING_KEYSTORE_BASE64 non è un base64 valido: rigeneralo come in docs/FIRMA.md"
            exit 1
          fi
          if ! OUT=$(keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$SIGNING_STORE_PASSWORD" 2>&1); then
            # Diagnostica senza segreti: dimensione e tipo del file decodificato, messaggio di keytool
            echo "Keystore decodificato: $(stat -c %s "$RUNNER_TEMP/release.jks") byte, tipo: $(file -b "$RUNNER_TEMP/release.jks")"
            echo "$OUT" | grep -i "error" || true
            echo "::error::Il keystore non si apre: controlla SIGNING_KEYSTORE_BASE64 e SIGNING_STORE_PASSWORD"
            exit 1
          fi
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test e build di release
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew test assembleRelease --stacktrace

      - name: Verifica che lo schema Room sia nel repository
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            echo "::error::Lo schema Room esportato è cambiato o manca: va aggiunto al commit."
            git status --porcelain app/schemas
            for f in $(git ls-files --others --modified app/schemas); do echo "===== $f"; cat "$f"; done
            exit 1
          fi

      - name: Verifica che l'APK non chieda Internet
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          if "$AAPT2" dump permissions "$APK" | grep -q "android.permission.INTERNET"; then
            echo "::error::L'APK dichiara il permesso INTERNET"
            exit 1
          fi

      - name: Risultati dei test
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

      - name: Carica l'APK firmato
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: gestione-spese-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Firma mancante
        if: env.HAS_SIGNING != 'true'
        run: |
          echo "::warning::Secret di firma non configurati: l'APK non è firmato e non viene pubblicato. Vedi docs/FIRMA.md."
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then exit 1; fi
